  - changed-files:
      - any-glob-to-any-file:
          - flake.nix
          - flake.lock
area/github:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
area/hosts:
  - changed-files:
      - any-glob-to-any-file:
          - hosts/**/*
area/just:
  - changed-files:
      - any-glob-to-any-file:
          - .justfile
          - .just/**/*
area/mise:
  - changed-files:
      - any-glob-to-any-file:
          - .mise/**/*
area/modules:
  - changed-files:
      - any-glob-to-any-file:
          - modules/**/*
area/renovate:
  - changed-files:
      - any-glob-to-any-file:
          - .renovaterc.json5
area/scripts:
  - changed-files:
      - any-glob-to-any-file:
