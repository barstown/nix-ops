---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Nix"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for unencrypted secrets
        run: ./scripts/check-secrets.sh

  check:
    name: Flake Check
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: List hosts
        id: hosts
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.host }}
    needs: check
    # All hosts are x86_64-linux today. For an aarch64 host, run it on ubuntu-24.04-arm.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.check.outputs.hosts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build system closure
        id: build
        run: |
          out="$(nix build --print-build-logs --no-link --print-out-paths \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # The Nix equivalent of a flux-local diff: which packages change versions.
      - name: Diff against main
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          base="$(nix build --no-link --print-out-paths \
            "git+file://$PWD?ref=${{ github.base_ref }}#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")"
          {
            echo "### Closure diff for \`${{ matrix.host }}\`"
            echo '```'
            nix store diff-closures "$base" "${{ steps.build.outputs.out }}" | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  nix-status:
    name: Nix Success
    needs: ["secrets", "check", "build"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
