---
# Post-quantum (ML-KEM-768 + X25519) age recipients. Public keys are safe to
# commit; the matching private keys never enter this repo.
#   admin  -> your workstation key ($SOPS_AGE_KEY_FILE), from `just bootstrap age-key`
#   hosts  -> generated ON each host by `just bootstrap host-key <host>`
# After changing recipients, run `just sops updatekeys`.
keys:
  - &admin 
  - &nix-test 

creation_rules:
  # Per-host secrets: readable only by that host (and you).
  - path_regex: ^hosts/nix-test/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *admin
          - *nix-test

  # Shared secrets: add every host that should read them.
  - path_regex: ^secrets/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *admin
          - *nix-test

stores:
  yaml:
    indent: 2
