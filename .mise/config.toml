[env]
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
# Project-unique post-quantum admin key (created by `just bootstrap age-key`).
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/nix-ops.txt"
# Flake hosts pull from, and that `just host deploy` builds from by default.
NIX_OPS_FLAKE = "github:barstown/nix-ops"
JUST_UNSTABLE = "1"

[tools]
"aqua:casey/just" = "1.58.0"
"aqua:charmbracelet/gum" = "2.0.2"
"aqua:cli/cli" = "2.102.0"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.13.3"
"aqua:jqlang/jq" = "1.8.2"
